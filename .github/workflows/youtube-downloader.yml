name: YouTube Downloader (با API downloaderto)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 لینک یوتیوب'
        required: true
        type: string
      quality:
        description: '📊 کیفیت'
        required: false
        default: '720p'
        type: choice
        options:
          - 360p
          - 480p
          - 720p
          - 1080p
          - بهترین
      retention_minutes:
        description: '⏱️ چند دقیقه فایل روی گیت‌هاب بماند؟ (حداقل 1)'
        required: false
        default: '30'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader script
        id: downloader
        run: |
          python scripts/downloader.py \
            --url "${{ github.event.inputs.youtube_url }}" \
            --quality "${{ github.event.inputs.quality }}" \
            --output-dir ./video

      - name: Upload video as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: video/*.mp4
          retention-days: 1   # حداقل یک روز، اما بعداً با API حذف می‌کنیم

      - name: Get artifact download URL
        id: artifact_url
        run: |
          ARTIFACT_ID="${{ steps.upload.outputs.artifact-id }}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}/artifacts/${ARTIFACT_ID}"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "🎬 عنوان: ${{ steps.downloader.outputs.video_title }}"
          echo "💾 کیفیت: ${{ github.event.inputs.quality }}"
          echo "🔗 لینک دانلود (تا زمان حذف معتبر است):"
          echo "${DOWNLOAD_URL}"
          echo "⏳ حذف خودکار بعد از ${{ github.event.inputs.retention_minutes }} دقیقه"
          echo "=========================================="

      - name: Auto-delete after retention period
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RETENTION_MINUTES: ${{ github.event.inputs.retention_minutes }}
          REPO: ${{ github.repository }}
        run: |
          echo "⏳ منتظر ${RETENTION_MINUTES} دقیقه..."
          sleep $(( ${RETENTION_MINUTES} * 60 ))
          echo "⏰ حذف خودکار artifact..."
          curl -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
            && echo "✅ حذف شد." || echo "⚠️ خطا در حذف (ممکن است قبلاً حذف شده باشد)"
