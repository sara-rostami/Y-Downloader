name: YouTube Downloader (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'لینک YouTube'
        required: true
        type: string
      quality:
        description: 'کیفیت'
        required: false
        default: '720p'
        type: choice
        options:
          - 360p
          - 480p
          - 720p
          - 1080p
          - best
      retention_minutes:
        description: 'چند دقیقه فایل بماند؟ (حداقل 1)'
        required: false
        default: '5'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------- تنظیم OAuth برای yt-dlp -------------------
      - name: Setup yt-dlp OAuth
        run: |
          mkdir -p ~/.config/yt-dlp
          # فعال کردن --netrc در config
          echo "--netrc" >> ~/.config/yt-dlp/config
          # ایجاد فایل netrc با حساب OAuth
          cat > ~/.netrc << EOF
          machine youtube login oauth password ""
          EOF
          chmod 600 ~/.netrc
          echo "✅ OAuth setup complete. First run will require device code authorization."

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download video with OAuth
        id: downloader
        run: |
          python scripts/download.py \
            --url "${{ github.event.inputs.youtube_url }}" \
            --quality "${{ github.event.inputs.quality }}" \
            --output-dir ./video

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: video/*.mp4
          retention-days: 1

      - name: Display download link
        id: artifact_url
        run: |
          ARTIFACT_ID="${{ steps.upload.outputs.artifact-id }}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}/artifacts/${ARTIFACT_ID}"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "🎬 عنوان: ${{ steps.downloader.outputs.video_title }}"
          echo "💾 کیفیت: ${{ github.event.inputs.quality }}"
          echo "🔗 لینک دانلود (تا زمان حذف معتبر است):"
          echo "${DOWNLOAD_URL}"
          echo "⏳ حذف خودکار بعد از ${{ github.event.inputs.retention_minutes }} دقیقه"
          echo "=========================================="

      - name: Auto-delete after retention period
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RETENTION_MINUTES: ${{ github.event.inputs.retention_minutes }}
          REPO: ${{ github.repository }}
        run: |
          echo "⏳ منتظر ${RETENTION_MINUTES} دقیقه..."
          sleep $(( ${RETENTION_MINUTES} * 60 ))
          echo "⏰ حذف خودکار artifact..."
          curl -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
            && echo "✅ حذف شد." || echo "⚠️ خطا در حذف (ممکن است قبلاً حذف شده باشد)"
