name: تست API دانلودرتو

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب کتابخانه‌ها
        run: pip install requests

      - name: اجرای تست کامل
        run: python test_api.py

      # مرحله جدید: ذخیره فایل HTML به عنوان artifact
      - name: آپلود فایل HTML برای بررسی
        uses: actions/upload-artifact@v4
        with:
          name: downloaderto-main-page
          path: /tmp/downloaderto_main.html
